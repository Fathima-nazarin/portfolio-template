<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="png" href="images/icon1.png" >
</head>

<body>
    <nav class="navbar">
        <ul>
            <li id="name" class="navname">Fathima Nazarin</li>
            <div class="rightlinks">
                <li><a href="#bio">about</a></li>
                <li><a href="#skills">skills</a></li>
                <li><a href="#projects">projects</a></li>
                <li><a href="#contact">contact</a></li>
                
                <div class="theme-buttons">
                    <button id="lightBtn" title="Lightmode" aria-label="Lightmode">light</button>
                    <button id="darkBtn" title="Darkmode"  aria-label="Darkmode"> dark</button>
                  </div>
            </div>
        </ul>
    </nav>
  <header class="hero">
    <div class="hero_content">
        <p class="hello">Hello, I'm</p>
        <h1>Fathima <span class="gradient-text">Nazarin</span></h1>
        <h2>I love <span id="typing"></span><span class="cursor">|</span></h2>
        <p id="tagline"></p>
        <nav id="links"></nav>
    </div>
    <div class="img_container">
        <img src="images/15.gif" class="img">
    </div>
  </header>
  <main>
    
    <section id="about">
      <h2>About</h2>
      <p id="bio"></p>
    </section>
    <section id="skillslist">
      <h2>Skills</h2>
      <ul id="skills" class="chips"></ul>
    </section>
    <section class="projects">
      <h2>Projects</h2>
      <div id="projects" class="grid"></div>
    </section>
    <section id="contact">
        <h2>Contact</h2>
        <p>Want to collaborate or just say hi? Find me on the links at the top of this page.</p>
    </section>
  </main>
  <footer id="footer"></footer>
  <script src="script.js"></script>
</body>

</html>
